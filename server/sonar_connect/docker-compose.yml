# Runs beside Navidrome, on Navidrome's network so logins can be checked at
# http://navidrome:4533. Only this PC can reach the port; phones get to it
# through Tailscale serve at /sonar-connect (see README.md).
services:
  sonar-connect:
    build: .
    image: sonar-connect:latest
    container_name: sonar-connect
    restart: unless-stopped
    ports:
      - "127.0.0.1:4534:4534"
    # NAVIDROME_ADMIN_USER / NAVIDROME_ADMIN_PASSWORD turn on /rescan (new
    # albums from Soulbeet show up straight away). Kept in .env, never in git.
    env_file:
      - path: .env
        required: false
    networks:
      - navidrome

networks:
  navidrome:
    external: true
    name: navidrome_default

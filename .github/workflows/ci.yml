# Tests on every push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Sonar Connect relay tests
        working-directory: server/sonar_connect
        run: python3 -m unittest -v test_relay
      - name: Server installer syntax
        run: bash -n server/install.sh && docker compose -f server/docker-compose.yml config --quiet
        env:
          MUSIC_DIR: /tmp

# Builds the apps. Pushing a tag like v1.2.0 publishes them as a GitHub
# release; running it by hand (Actions > Build apps > Run workflow) only
# builds them and keeps the files as downloadable artifacts for a while.
#
# Android releases are signed with the project's release key, from two
# repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_B64   the keystore file, base64
#   ANDROID_KEY_PASSWORD   its password
# A fork without them still builds, signed with a throwaway debug key.
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/sonar-release.jks
            printf 'storeFile=sonar-release.jks\nstorePassword=%s\nkeyAlias=sonar\nkeyPassword=%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::warning::No release key secrets: this APK is signed with a debug key."
          fi
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-*-release.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sonar-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: sonar-windows.zip

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Unsigned: AltStore / SideStore / Sideloadly sign it with the
      # installer's own Apple ID when they put it on the phone.
      - run: flutter build ios --release --no-codesign
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr sonar-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: sonar-ios.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
